name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/sitl -DVRP_BOARD=sitl -DVRP_VEHICLE=quad
      - name: Build
        run: cmake --build build/sitl
      - name: SITL tests
        run: ./Tools/run_sitl_tests.sh
      - name: Library parity tests (phases 1–20)
        run: python3 test/libraries/run_all_library_tests.py
      - name: ChibiOS compile shape check
        run: cmake -S . -B build/vrbrain-v54 -DVRP_BOARD=VRBrain-v54 -DVRP_VEHICLE=quad -DVRP_TARGET_CHIBIOS=ON && cmake --build build/vrbrain-v54
      - name: ESP32 compile shape check
        run: cmake -S . -B build/vresp32-v1 -DVRP_BOARD=VREsp32-v1 -DVRP_VEHICLE=quad -DVRP_TARGET_ESP32=ON && cmake --build build/vresp32-v1

  cert-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate library parity and cert packs
        run: python3 Tools/cert/gen_parity_and_libraries.py
      - name: Complete certification artifacts
        run: python3 Tools/cert/gen_cert_complete.py
      - name: Generate RTM
        run: python3 Tools/cert/gen_traceability.py
      - name: Verify library registry count
        run: python3 -c "import json; assert len(json.load(open('certification/LIBRARY_REGISTRY.json')))==153"
      - name: Verify no planned libraries
        run: python3 -c "import json; assert sum(1 for r in json.load(open('certification/LIBRARY_REGISTRY.json')) if r['status']=='planned')==0"
      - name: Verify SDD templates removed
        run: |
          if rg -l '_TBD during implementation' certification/libraries --glob 'VRP-SDD-*.md'; then exit 1; fi
